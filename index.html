<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kieke's Pukies</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body{background:var(--bg,#F7F4EC);}
  .admin-shell{display:none;min-height:100vh;grid-template-columns:220px 1fr;}
  .admin-shell.active{display:grid;}
  .admin-sidebar{background:var(--soil);color:#fff;padding:24px 18px;display:flex;flex-direction:column;}
  .admin-sidebar .brand{font-family:'Fraunces',serif;font-weight:700;font-size:18px;margin-bottom:4px;}
  .admin-sidebar .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ffffff99;margin-bottom:28px;}
  .admin-nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#ffffffcc;font-size:14.5px;font-weight:600;padding:11px 12px;border-radius:var(--radius-sm);cursor:pointer;margin-bottom:4px;font-family:inherit;}
  .admin-nav-btn:hover{background:#ffffff14;color:#fff;}
  .admin-nav-btn.active{background:var(--brand);color:#fff;}
  .admin-sidebar-foot{margin-top:auto;padding-top:20px;border-top:1px solid #ffffff22;}
  .admin-view-link{display:block;font-size:13px;color:#ffffffaa;margin-bottom:14px;text-decoration:none;}
  .admin-view-link:hover{color:#fff;}
  .admin-who{font-size:12.5px;color:#ffffff99;margin-bottom:10px;word-break:break-all;}
  .admin-main{padding:32px 36px;overflow-x:hidden;}
  .admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .admin-h1{font-family:'Fraunces',serif;font-weight:700;font-size:26px;}
  .admin-tabs{display:none;}
  .admin-tabs.active{display:block;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:32px;}
  .stat-card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px;}
  .stat-card .num{font-family:'Fraunces',serif;font-weight:700;font-size:28px;}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .admin-card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:24px;}
  .admin-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .admin-card-head h2{font-family:'Fraunces',serif;font-size:19px;font-weight:700;}

  table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.admin-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.admin-table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.admin-table tr:last-child td{border-bottom:none;}
  .admin-icon-cell svg{width:26px;height:26px;}
  .admin-badge{display:inline-block;padding:3px 10px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge-active{background:var(--brand-tint);color:var(--brand-dark);}
  .badge-inactive{background:var(--line);color:var(--ink-soft);}
  .row-actions{display:flex;gap:8px;}
  .row-actions button{background:none;border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--soil);}
  .row-actions button:hover{border-color:var(--soil);}
  .row-actions button.danger{color:var(--accent-dark);}
  select.status-select{font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--paper);color:var(--soil);}

  .admin-form{display:none;background:var(--brand-tint);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .admin-form.active{display:block;}
  .admin-form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .admin-form label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;}
  .admin-form input,.admin-form select,.admin-form textarea{width:100%;font-family:inherit;font-size:14px;padding:9px 11px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--paper);}
  .admin-form .field{margin-bottom:14px;}
  .admin-form .checkline{display:flex;align-items:center;gap:8px;}
  .admin-form .checkline input{width:auto;}
  .icon-pick-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .icon-pick{width:40px;height:40px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-pick svg{width:22px;height:22px;}
  .icon-pick.selected{border-color:var(--brand);background:var(--brand-tint);}

  .filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-pill{padding:6px 14px;border-radius:var(--radius-pill);border:1.5px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-soft);}
  .filter-pill.active{background:var(--soil);color:#fff;border-color:var(--soil);}

  .admin-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;}
  .admin-avatar-fallback{width:32px;height:32px;border-radius:50%;background:var(--moss);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:'Fraunces',serif;}

  /* ---------- GATE ---------- */
  .gate-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate-box{max-width:380px;width:100%;background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:40px;text-align:center;}
  .gate-box h1{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin-bottom:6px;}
  .gate-box p{font-size:13.5px;color:var(--ink-soft);margin-bottom:24px;}
  #adminGoogleBtn{display:flex;justify-content:center;min-height:44px;}
  .gate-denied{display:none;}
  .gate-denied.active{display:block;}

  @media (max-width:820px){
    .admin-shell.active{grid-template-columns:1fr;}
    .admin-sidebar{flex-direction:row;overflow-x:auto;padding:14px;align-items:center;}
    .admin-sidebar .brand,.admin-sidebar .tag,.admin-sidebar-foot{display:none;}
    .admin-nav-btn{white-space:nowrap;margin-bottom:0;}
    .admin-main{padding:20px 16px;}
    .admin-form .grid2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ================= GATE (shown until an admin is confirmed) ================= -->
<div class="gate-wrap" id="gateWrap">
  <div class="gate-box">
    <h1>Kieke's Pukies</h1>
    <p id="gateMsg">Admin sign-in required.</p>
    <div id="adminGoogleBtn"></div>
    <div class="gate-denied" id="gateDenied">
      <p style="color:var(--accent-dark);font-weight:600;margin-bottom:14px;">This account doesn't have admin access.</p>
      <button class="btn btn-outline btn-full" id="gateSignOutBtn">Sign out</button>
    </div>
  </div>
</div>

<!-- ================= ADMIN APP ================= -->
<div class="admin-shell" id="adminShell">
  <aside class="admin-sidebar">
    <div class="brand">Kieke's Pukies</div>
    <div class="tag">Admin</div>
    <button class="admin-nav-btn active" data-tab="dashboard">Dashboard</button>
    <button class="admin-nav-btn" data-tab="products">Products</button>
    <button class="admin-nav-btn" data-tab="orders">Orders</button>
    <button class="admin-nav-btn" data-tab="users">Users</button>
    <div class="admin-sidebar-foot">
      <a class="admin-view-link" href="https://kiekes-pukies.vercel.app" target="_blank" rel="noopener">↗ View storefront</a>
      <div class="admin-who" id="adminWhoEmail"></div>
      <button class="btn btn-outline btn-full" id="adminSignOutBtn" style="background:transparent;color:#fff;border-color:#ffffff33;">Sign out</button>
    </div>
  </aside>

  <main class="admin-main">
    <!-- ---------- DASHBOARD ---------- -->
    <section class="admin-tabs active" data-tab="dashboard">
      <div class="admin-topbar"><h1 class="admin-h1">Dashboard</h1></div>
      <div class="stat-grid" id="statGrid"></div>
      <div class="admin-card">
        <div class="admin-card-head"><h2>Recent orders</h2></div>
        <div style="overflow-x:auto;"><table class="admin-table" id="recentOrdersTable"></table></div>
      </div>
    </section>

    <!-- ---------- PRODUCTS ---------- -->
    <section class="admin-tabs" data-tab="products">
      <div class="admin-topbar">
        <h1 class="admin-h1">Products</h1>
        <button class="btn btn-primary" id="addProductBtn">+ Add Product</button>
      </div>

      <form class="admin-form" id="productForm">
        <input type="hidden" id="pfId">
        <div class="grid2">
          <div class="field"><label for="pfName">Name</label><input id="pfName" required></div>
          <div class="field"><label for="pfCategory">Category</label><input id="pfCategory" required list="catList" placeholder="e.g. Seafood"></div>
        </div>
        <datalist id="catList"></datalist>
        <div class="grid2">
          <div class="field"><label for="pfPrice">Price (USD)</label><input id="pfPrice" type="number" step="0.01" min="0" required></div>
          <div class="field">
            <label class="checkline" style="margin-top:30px;"><input type="checkbox" id="pfActive" checked> Active (visible on storefront)</label>
          </div>
        </div>
        <div class="field"><label for="pfDesc">Description</label><textarea id="pfDesc" rows="2" required></textarea></div>
        <div class="field"><label>Icon</label><div class="icon-pick-grid" id="iconPickGrid"></div></div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button type="submit" class="btn btn-primary" id="pfSubmitBtn">Add Product</button>
          <button type="button" class="btn btn-outline" id="pfCancelBtn">Cancel</button>
        </div>
      </form>

      <div class="admin-card">
        <div style="overflow-x:auto;"><table class="admin-table" id="productsTable"></table></div>
      </div>
    </section>

    <!-- ---------- ORDERS ---------- -->
    <section class="admin-tabs" data-tab="orders">
      <div class="admin-topbar"><h1 class="admin-h1">Orders</h1></div>
      <div class="filter-pills" id="orderFilterPills"></div>
      <div class="admin-card">
        <div style="overflow-x:auto;"><table class="admin-table" id="ordersTable"></table></div>
      </div>
    </section>

    <!-- ---------- USERS ---------- -->
    <section class="admin-tabs" data-tab="users">
      <div class="admin-topbar"><h1 class="admin-h1">Users</h1></div>
      <div class="admin-card">
        <div style="overflow-x:auto;"><table class="admin-table" id="usersTable"></table></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="adminToast"></div>

<script src="supabase-client.js"></script>
<script src="icons.js"></script>
<script src="admin.js"></script>
</body>
</html>
